schema_version: 1
experiment_id: pusht_motion_damping_factorized_context_response_mve_v1
date: "2026-08-20"

question: >-
  Does explicitly factorizing query-dependent response from episode dynamics
  recover Motion-Damping ICL when a simple additive oracle context does not?

evidence_boundary:
  role: development_only_oracle_factorization_upper_bound
  public_test_open: false
  cem_open: false
  final_method_claim_authorized: false
  prior_result: >-
    The 384-parameter additive oracle projection failed the 256-step screen
    and was numerically indistinguishable from its constant control despite
    learning distinct oracle columns.

identities:
  release_id: contextworld_pusht_motion_damping_icl_history3_v1
  release_sha256: 1795717d8bfa1d1cfcc01a69931b6241b0e7759dcf43553a6c4cca225ec9326b
  initialization_sha256: 9f13b2c28bb909338047e08d62bf6eb16ea3616cb53e57cfa9b5072b43db1c59
  development_pairs: 256
  train_pairs: 8192

training:
  seed: 14321
  optimizer_steps: 256
  batch_size: 128
  original_rows: 64
  hidden_rows: 64
  hidden_order: complete_forward_reverse_twins_with_adjacent_faster_then_no_extra_pairs
  learning_rate: 0.00005
  weight_decay: 0.001
  gradient_clip_norm: 1.0
  precision: bfloat16

architecture:
  base: native_lewm
  formula: W_o_SiLU_W_q_zquery_aquery_elementwise_W_c_cepisode
  query_features: [last_history_latent, last_query_action_embedding]
  response_target: terminal_prediction_only
  rank: 8
  output_initialization: exact_zero
  added_trainable_parameters: 4624
  native_modules_jointly_trainable: true
  step0_exact_native: true

arms:
  oracle:
    original_context: [0.0, 0.0]
    faster_decay_context: [1.0, 0.0]
    no_extra_decay_context: [0.0, 1.0]
    privileged_label_diagnostic_only: true
  constant:
    original_context: [0.0, 0.0]
    hidden_context: [0.7071067811865475, 0.7071067811865475]
    same_architecture_and_parameter_count: true
    contains_condition_identity: false

objective:
  prediction: native_identifiable_future_mse
  regularizer: original_sigreg
  regularizer_weight: 0.09
  additional_loss: null

evaluation:
  split: frozen_development_loader_validation
  public_test_open: false
  cem_open: false
  bootstrap_replicates: 10000
  bootstrap_seed: 14321
  screen_thresholds_reused_from: pusht_motion_damping_oracle_context_predictor_mve_v1

decision:
  advance_condition: >-
    Oracle must pass the absolute 256-step screen and materially beat the
    matched constant arm before any 1024-step replay or learned context work.
  failure_boundary: >-
    Failure rejects this rank-8 terminal B(q)c realization at 256 steps, not
    all nonlinear context-conditioned world models.
