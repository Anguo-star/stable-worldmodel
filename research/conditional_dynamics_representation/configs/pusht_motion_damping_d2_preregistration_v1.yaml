d2_v1_physical_route:
  status: frozen_structural
  prefix_action_program: all_zero_same_as_d0
  query_action_route: contact_mediated_nonzero_action
  history_excitation_added: false
  numerical_inverse_solver_required: false
  contact_friction:
    value: 0.25
    role: fixed_nuisance_not_hidden_factor
  rationale: >-
    P0 只读 CPU 探针显示，现有 simulator 中接触自由 query action 的 condition-gap
    difference-of-differences 逐分量为 0；朝向 block 的接触动作产生非零 block response Gamma。
  formal_confirmation_required: p1a_training_only_feasibility_probe
  query_action_box_contract:
    per_component_bounds: [-1.0, 1.0]
    per_raw_step_l2_norm_max: 1.0
    reason: "L2 单位球在 rigid rotation 下不变，并保证旋转后的两个分量仍落在 [-1,1]"
    transformed_action_checks:
      - "rigid transform 后的动作必须原样通过 _action_array；禁止 clip"
      - "旋转前后每个 raw step 的 L2 范数逐元素相等"
      - "同一 direction 的两种 damping 收到逐元素相同动作"
  required_contact_controls:
    - history_contact_free
    - query_start_has_no_contact_or_cached_arbiter
    - both_conditions_contact_block
    - first_contact_physics_substep_equal_or_within_frozen_tolerance
    - per_step_contact_and_arbiter_trace_recorded
    - first_contact_normal_point_impulse_recorded
    - non_grazing_contact_margin
    - contact_and_gamma_stable_under_preregistered_small_geometry_action_perturbations
    - fixed_contact_friction_all_conditions_and_comparators
    - same_damping_gamma_null_comparator
  gamma_null_comparator_semantics: >-
    audit-only x2 replay：同 canonical x2、同 damping、同 action、同 CRN；允许在独立 comparator
    simulator 的起点安装一次 x2，不写训练行，不适用训练轨迹的 state_installations_after_x0 门。
  validator_contract:
    implementation: research_local_d2_validator
    legacy_motion_validator_reused_as_whole: false
    reason: >-
      既有 evaluate_template / validate_motion_damping_pair 把 query_contact_free 与
      history_and_query_have_no_cached_arbiters 作为成功条件，和 D2 的 query-contact 路由相冲突；
      D2 只复用无冲突的状态、连续性与哈希原语，并由新校验器显式替换接触相关断言。
    reversed_legacy_assertions:
      - evaluate_template.query_contact_free
      - evaluate_template.query_has_no_cached_arbiters
      - validate_motion_damping_pair.query_contact_free
      - validate_motion_damping_pair.history_and_query_have_no_cached_arbiters
    query_start_arbiter_definition: >-
      query_start_arbiter_cache_count := history_arbiter_counts[-1]，即最后一个 history raw step
      完成后、首个 query action 施加前的缓存数；query 每步后的 arbiter 另列记录。
    first_contact_raw_step_definition: >-
      从 rows['n_contacts'][10:15] 中第一个正值的索引派生；该值是每个 raw step post-solve 后的
      接触点计数，不冒充 physics-substep 时刻。physics-substep 时刻由 D2 新 instrumentation 单独记录。
    motion_friction_assertions:
      - "agent shape friction * block shape friction == 0.25"
      - "wall friction == 0"
      - "space.damping == DAMPING_VALUES[mode]"
      - "active、a_ref、Gamma-null comparator 的每个 condition 都执行同一断言并写回执"

