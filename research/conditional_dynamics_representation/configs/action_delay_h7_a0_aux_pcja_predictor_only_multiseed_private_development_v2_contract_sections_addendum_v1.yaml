    any_new_training: true
    evaluation_or_scoring_authorized: false
    checkpoint_may_be_opened: false
    one_use_consumption_rule_relaxed: false
    spent_v1_release_may_be_reconsumed: false
    candidate_set_may_change: false
    seeds_may_change: false
    gate_thresholds_may_change: false
    terminal_budget_may_change: false
    cross_seed_pooling_averaging_or_rescue: false
    selective_reporting: false
    rejecting_the_pairing_method_family: false

# ---------------------------------------------------------------------------
# Section 1 of 3: training_contract
# ---------------------------------------------------------------------------
# Carried from the v1 preregistration's training_contract with exactly one
# change: the terminal cells are the two replication seeds instead of seed
# 3072.  Objective, sampler, gradient route, PCJA weight and terminal budget
# are inherited verbatim.  Nothing here authorizes a training step; both seeds
# are already trained and frozen.

training_contract:
  objective: >-
    native weighted live MSE plus 0.09 native SIGReg plus 0.09 auxiliary PCJA
    through step1024 with predictor-only gradient routing
  sampler: standard DistributedSampler
  terminal_optimizer_step: 1024
  auxiliary_pcja_active_optimizer_steps: [1, 1024]
  auxiliary_pcja_gradient_allowed: [predictor, pred_proj]
  auxiliary_pcja_gradient_blocked: [encoder, projector, action_encoder]
  exact_step256_full_state_required: true
  exact_step256_to_step1024_continuation_required: true
  inherited_verbatim_from: research/conditional_dynamics_representation/configs/action_delay_h7_a0_aux_pcja_predictor_only_private_development_v1.yaml
  inherited_config_sha256: f57f2de07db43ce6f33499eb042d74a73213b49e4a09cda55884fe3ad887ec6d
  the_only_difference_from_v1: the terminal cells are seeds 4096 and 5120 rather than seed 3072
  training_already_complete_no_step_authorized_here: true
  measured_terminal_state:
    - seed: 4096
      global_step: 1024
      initial_global_step: 256
      continuation_optimizer_steps: 768
      world_size: 8
      pcja_weight_all_steps: 0.09
      scientific_training_complete: true
      native_clean_exit: false
      terminal_identity_finalization_authorized: true
      evidence: research/conditional_dynamics_representation/artifacts/action_delay_h7_a0_aux_pcja_predictor_only_multi_seed_v1/training/continue1024_s4096_v1/contextworld_report.json
      evidence_sha256: 5bb4aff1876f137187953244c983c8467eafbb95cf52f186094d6ed3df47fbd3
    - seed: 5120
      global_step: 1024
      initial_global_step: 256
      continuation_optimizer_steps: 768
      world_size: 8
      pcja_weight_all_steps: 0.09
      scientific_training_complete: true
      native_clean_exit: false
      terminal_identity_finalization_authorized: true
      evidence: research/conditional_dynamics_representation/artifacts/action_delay_h7_a0_aux_pcja_predictor_only_multi_seed_v1/training/continue1024_s5120_v1/contextworld_report.json
      evidence_sha256: 15a45ba01c1b3e9e0613445f8be7efb2ad88681dd42d981ed686f9d6480e29ab
  non_clean_exit_disclosed: >-
    Neither seed exited the launcher cleanly; both checkpoints are eligible via
    exact post-fit recovery, whose audit confirmed loss.checks.exact_steps,
    checkpoint.final_matches_full and checkpoint.fabricated_step1024_absent.
    This is disclosed rather than concealed, exactly as the PLDM v4 precedent
    disclosed launcher_exit_code 1 for its two confirmation seeds.

