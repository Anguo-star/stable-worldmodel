# Append-only contract-sections addendum v1 for the predictor-only multi-seed
# Development release v2.
#
# WHY THIS EXISTS: the v2 preregistration was drafted without three items that
# the FROZEN builder chain requires.  This was found by executing the frozen
# validators against the v2 config, not by reading them:
#
#   _contract_sections(v2)        -> missing 'training_contract', 'runtime_rebind'
#   _validate_runtime_rebind(v2)  -> ContractError: previous ContextWorld commit changed
#   _validate_config_binding(v2)  -> ContractError: prior Private binding chain changed
#                                    {parent_config: False, latest: False, release_list: False}
#
# The frozen v1 files may not be edited, and the v2 preregistration is itself
# frozen.  This addendum supplies the three items append-only.
#
# WHAT IT DOES NOT DO: it does not change a seed, a candidate, a gate threshold,
# a budget, or any decision rule.  It adds only the sections the builder needs
# in order to run at all, and it derives their contents from already-frozen
# artifacts rather than choosing new values.

