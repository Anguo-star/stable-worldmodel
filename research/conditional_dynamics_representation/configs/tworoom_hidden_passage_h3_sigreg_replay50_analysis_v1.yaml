door_rule_inference:
  role: primary_mechanism_gate
  unit: frozen_query
  queries: 300
  eval_seeds: [42, 43, 44, 45, 46, 47]
  queries_per_seed: 50
  target: real_simulator_next_state_encoded_by_the_scored_checkpoint
  query_action_policy: identical_frozen_crossing_action_for_both_rules
  decision_source: checkpoint_summary.decision.passed
  rationale: >
    Fixing the action isolates whether history changes the predicted next state.
    CEM is intentionally excluded from this gate because optimizer quality and
    goal geometry are not part of rule-identification.

original_domain_planning:
  role: primary_utility_noninferiority_gate
  unit: paired_frozen_query
  eval_seeds: [42, 43, 44, 45, 46, 47]
  queries_per_seed: 50
  total_queries: 300
  success_metric: real_environment_goal_success_after_executing_cem_plan
  comparison: candidate_minus_control
  noninferiority_margin_absolute: 0.05
  confidence: 0.95
  confidence_sidedness: one_sided_lower_bound
  interval:
    method: eval_seed_stratified_paired_percentile_bootstrap
    resamples: 20000
    seed: 20260728
  decision: lower_confidence_bound_strictly_greater_than_negative_margin

secondary_metrics:
  original_rollout_horizons_action_blocks: [1, 2, 3, 5]
  report_native_latent_mse: true
  gate_on_native_latent_mse: false
  rationale: >
    Native latent MSE is representation-scale dependent across checkpoints.
    It diagnoses prediction fit but cannot replace real-environment CEM success.
  report_spearman_or_candidate_ranking: false

falsification_decision:
  stop_structural_defect_and_new_objective_route_if:
    - at_least_one_increased_weight_passes_all_frozen_door_gates
    - the_same_checkpoint_is_original_cem_noninferior_to_lambda_0p09
  otherwise: the_preregistered_falsification_gate_does_not_reject_a_pareto_conflict
  scope_limit: one_training_seed_is_a_mechanism_falsification_not_a_final_multiseed_performance_claim
