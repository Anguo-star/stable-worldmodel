schema_version: 1
experiment_id: pusht_motion_damping_factorized_paired_response_mve_v1
date: "2026-08-20"

question: >-
  Does a direct paired conditional-response signal become effective when it
  is assigned to an explicit query-by-context branch rather than the shared
  Predictor trunk?

evidence_boundary:
  role: development_only_factorized_paired_response_mve
  public_test_open: false
  cem_open: false
  final_method_claim_authorized: false
  motivating_observations:
    jointly_trained_rank8_branch_gain: 0.00147627
    jointly_trained_native_trunk_gain: -0.11334736
    routed_rank64_oracle_gain: 0.00618687
    routed_rank64_constant_gain: 0.00537669

identities:
  release_id: contextworld_pusht_motion_damping_icl_history3_v1
  release_sha256: 1795717d8bfa1d1cfcc01a69931b6241b0e7759dcf43553a6c4cca225ec9326b
  initialization_sha256: 9f13b2c28bb909338047e08d62bf6eb16ea3616cb53e57cfa9b5072b43db1c59
  development_pairs: 256
  train_pairs: 8192

training:
  seed: 14321
  optimizer_steps: 256
  batch_size: 128
  original_rows: 64
  hidden_rows: 64
  hidden_order: complete_forward_reverse_twins_with_adjacent_faster_then_no_extra_pairs
  learning_rate: 0.00005
  weight_decay: 0.001
  gradient_clip_norm: 1.0
  precision: bfloat16

architecture:
  base: native_lewm
  response_branch: B_query_times_context
  rank: 64
  added_trainable_parameters: 36992
  function_at_step0_exact_native: true
  hidden_terminal_gradient_destination: factorized_response_branch_only

arms:
  oracle:
    original_context: [0.0, 0.0]
    faster_decay_context: [1.0, 0.0]
    no_extra_decay_context: [0.0, 1.0]
    privileged_label_diagnostic_only: true
  constant:
    original_context: [0.0, 0.0]
    hidden_context: [0.7071067811865475, 0.7071067811865475]
    same_architecture_parameter_count_route_and_loss: true
    contains_condition_identity: false

objective:
  native_prediction: original_full_horizon_plus_routed_hidden_terminal_mse
  regularizer: original_sigreg
  regularizer_weight: 0.09
  paired_response: target_energy_normalized_high_minus_low_regression
  paired_response_weight: 1.0
  paired_response_target_detached: true
  hidden_numeric_label_used_by_loss: false
  pair_order_used: true

evaluation:
  split: frozen_development_loader_validation
  public_test_open: false
  cem_open: false
  bootstrap_replicates: 10000
  bootstrap_seed: 14321
  screen_thresholds_reused_from: pusht_motion_damping_oracle_context_predictor_mve_v1

decision:
  advance_condition: >-
    Oracle must pass the absolute 256-step response screen and materially beat
    constant. Only that arm may continue to 1024.
  failure_boundary: >-
    Failure rejects this explicit rank-64 oracle factorization plus one paired
    response term; it does not justify another marginal regularizer search.
