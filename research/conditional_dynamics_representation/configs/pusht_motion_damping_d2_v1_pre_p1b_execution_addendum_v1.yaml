  bootstrap_seed: 2026090405
  pilot_candidate_windows:
    calibration_group_indices: [0, 8191]
    sealed_holdout_group_indices: [8192, 16383]
  group_identity_rule: >-
    Generate with the read-only ContextWorld Training distribution tag, then replace
    template ids with seed-bearing pmd-d2-v1 identifiers before any rollout.  Candidate
    windows, quotas, action assignment, and structural-admission algorithm are committed
    before outcomes.  Final accepted manifests are the deterministic result of that
    algorithm; no candidate may be replaced because of Gamma, rho, probe, or model results.

p1b_design:
  groups: {calibration: 192, sealed_holdout: 192}
  coverage: {reference: frozen_d0_64_cells, groups_per_cell_per_split: 3}
  groups_per_action_stratum_per_cell: 1
  primary_training_population_proxy:
    natural_anchor_fraction: 0.5
    natural_anchor_source: frozen_d0_uniform_coverage_balanced_training_groups
    designed_fraction: 0.5
    note: d1_ms50_is_a_comparison_baseline_not_the_d2_natural_anchor
  rho_query_action_cell: planner_contact_family_v1
  rho_descriptor_includes_exact_query_action: true
  action_strata_per_coverage_cell:
    - {id: low_approach, planner_scale: 0.25, tangent_angle_degrees: 0.0}
    - {id: mid_approach, planner_scale: 0.625, tangent_angle_degrees: 0.0}
    - id: mid_tangent_assisted
      planner_scale: 0.625
      tangent_angle_degrees_by_cell_parity: {even: 15.0, odd: -15.0}
      holdout_uses_opposite_sign: true
  action_formula: >-
    Start from the frozen planner vector clip((block_position + block_velocity -
    agent_position)/100,-1,1), rotate it by the declared local tangent angle without
    changing its norm, multiply by the declared planner scale, and repeat for five raw steps.
  admission_may_use_only: [coverage_quota, action_norm_and_box, history_contact_free,
                           canonical_query_match, query_start_clear,
                           both_conditions_contact, equal_first_contact_raw_step,
                           inherited_history_and_future_separation, playfield_bounds]
  admission_must_not_use: [gamma_magnitude, rho, probe_score, model_or_gradient,
                           development, public_test]
  quota_fill_rule: >-
    Within each frozen candidate window and coverage/action stratum, scan candidates in
    increasing group-index order and admit the first one that passes all allowed structural
    checks.  Exhausting any quota is a valid P1b structural failure; no new window or seed.
  rejected_candidate_accounting_required: true
  robustness_is_audit_only:
    action_rotation_degrees: [-2.0, 2.0]
    agent_geometry_shift_px_along_local_tangent: [-1.0, 1.0]

