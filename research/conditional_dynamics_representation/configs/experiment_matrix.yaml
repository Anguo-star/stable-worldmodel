    - matching_vs_opposite_history_win_rate
    - strict_win_rate
    - minimum_eval_seed_direction_cell_accuracy
  geometry:
    - encoder_paired_to_unrelated_distance_ratio
    - projector_paired_to_unrelated_distance_ratio
    - correct_rule_switch_rate
    - global_variance
    - global_effective_rank
  original_ability:
    - frozen_rollout_native_mse_h1_h2_h3_h5
    - frozen_rollout_cosine_error_h1_h2_h3_h5
    - cem_success_rate_50x6
    - cem_mean_final_distance
  excluded_metrics:
    - spearman_candidate_ranking
    - candidate_order_correlation
  comparison_rule: >-
    不跨 checkpoint 直接用 native latent MSE 判断 Door 选择能力；Door 使用
    checkpoint 内配对选择与尺度归一化几何。原任务回归同时报告 native MSE、
    cosine error 和闭环 CEM。

