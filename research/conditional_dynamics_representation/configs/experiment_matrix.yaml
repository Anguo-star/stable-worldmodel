preregistered_cross_scenario:
  name: hidden_action_remapping_history_probe_strength
  mechanisms:
    mx: "(+x) maps to (+x)"
    my: "(+x) maps to (+y)"
  paired_history:
    first_action: "rho * (+x)"
    second_action: "rho * (-x)"
    current_state_after_history: identical_center_state
    action_queue_after_history: identical_empty_queue
    query_action: "full_scale * (+x)"
    futures: "Mx moves along x; My moves along y"
  controlled_axis:
    history_probe_strength_rho: [1.0, 0.5, 0.25, 0.125]
    query_future_separation_changes_with_rho: false
    original_to_synthetic_replay_ratio: "50:50"
  primary_models:
    - lewm_joint_sigreg_0p09
    - lewm_fixed_representation
    - pldm_joint
  causal_interventions:
    - lower_encoder_learning_rate
    - predictor_warmup_before_joint_training
  second_axis_after_primary_boundary:
    episode_static_paired_nuisance_background: [off, on]
  support_pattern:
    - lewm_joint_pair_distance_contracts_before_capability_failure
    - fixed_representation_and_pldm_pass_at_weaker_rho
    - encoder_slowdown_or_predictor_warmup_moves_failure_boundary
    - nuisance_preserves_global_statistics_but_moves_failure_boundary
  falsification_pattern:
    - joint_and_fixed_representation_fail_at_same_rho
    - capability_fails_without_prior_conditional_pair_contraction
    - causal_interventions_do_not_move_boundary

