general_mechanism_model:
  representation: "z_m = u + alpha * m * d"
  predictor: "z_hat_m = u + alpha * beta * m * d"
  mechanism_loss: "C * alpha^2 * (1 - beta)^2"
  encoder_contraction_gradient_scale: "O(alpha * (1 - beta)^2)"
  predictor_mechanism_learning_gradient_scale: "O(alpha^2 * |1 - beta|)"
  implication: >-
    alpha 开始缩小时，beta 的学习信号比 alpha 的收缩信号更快消失，
    形成自增强的表示—预测器竞赛。
  marginal_identifiability_limit: >-
    只依赖 P(Z) 的正则无法区分具有相同边缘表示分布、但 P(Z,M)
    耦合不同的编码。

