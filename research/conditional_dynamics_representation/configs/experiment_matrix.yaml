schema_version: 8
project: conditional_dynamics_representation
date: "2026-07-27"
status: door_mechanism_localized_weight_boundary_seed3072_complete

research_question: >-
  当历史能够识别当前画面不可见的转移机制时，共享在线目标 Encoder
  是否会通过删除该机制方向来降低 prediction loss；无条件边缘正则
  能否在不损害普通控制能力的情况下稳定保护该方向？

claim_scope:
  established: >-
    Door 场景中的默认 LeWM 失败由 Encoder 参数更新携带，表现为规则相关
    未来的选择性压近；默认 0.09×SIGReg 的早期反收缩梯度不足。
  mechanism_hypothesis: >-
    这是端到端在线目标表示与 Predictor 之间的优化竞赛，而非 Door
    语义特例；当机制方向收缩后，Predictor 学习机制的梯度更快衰减。
  not_yet_established:
    - 同一收缩轨迹已在结构不同的隐藏机制上复现
    - 0.20 在 Door 上通过或失败
    - 公平 replay 协议下存在不可避免的 Door 与原任务权衡
    - 已有新的条件感知训练目标

