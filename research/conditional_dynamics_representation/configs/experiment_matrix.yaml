  - prediction_gradient_updates_shared_online_target_encoder
  - predictor_mechanism_learning_is_slower_than_encoder_contraction
  - mechanism_direction_has_low_marginal_energy_or_frequency
  - nuisance_or_other_visual_directions_can_satisfy_marginal_statistics

