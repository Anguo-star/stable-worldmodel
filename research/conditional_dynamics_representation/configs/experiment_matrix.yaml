schema_version: 9
project: conditional_dynamics_representation
date: "2026-07-28"
status: structural_claim_falsified_at_replay50_seed3072_gate

research_question: >-
  默认 0.09×SIGReg 下观察到的条件动力学压缩，是否构成必须引入新目标的
  LeWM 结构性缺陷；还是仅提高现有 SIGReg 权重就能同时恢复 Door 规则能力
  并保持原始域闭环规划能力？

claim_scope:
  established: >-
    Door 场景中的默认 LeWM 失败由 Encoder 参数更新携带，表现为规则相关
    未来的选择性压近；默认 0.09×SIGReg 的早期反收缩梯度不足。SIGReg
    的边缘统计目标不单独保证历史条件信息保留。
  falsified_at_current_gate: >-
    固定 50% 原始 replay、50% Door replay 后，λ=0.90 在 seed 3072
    通过 Door rule-switch-v2，且真实环境 CEM 相对 λ=0.09 非劣。因此当前
    证据不支持不可避免的结构性缺陷，也不支持据此开发新训练目标。
  scope_limits:
    - λ=0.90 是单训练 seed 的自适应反证点，不是多 seed 性能结论
    - 尚未证明一个固定权重可跨 TwoRoom、Push-T 和其他任务稳定工作
    - 边缘正则缺少条件信息保证仍成立，但缺少保证不等于经验上必须修复

