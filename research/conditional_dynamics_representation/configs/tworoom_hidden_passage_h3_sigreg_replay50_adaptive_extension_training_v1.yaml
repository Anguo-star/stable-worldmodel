training_protocol:
  architecture: stable_worldmodel_lewm_history3
  history_tokens: 3
  raw_steps_per_action_block: 5
  model_visible_fields:
  - pixels
  - action
  diagnostic_only_fields:
  - proprio
  synthetic_only: false
  initialization_checkpoint:
    path: artifacts/training/runs/checkpoints/h3_origheldout_s3072/weights_final_step_6420.pt
    sha256: 7d141b86cca49145444a69bff89c71ede69e8cf8252bfb933e656c3e2e962b54
    config_sha256: 44b5bde83fbc91634ef84acbdba9a75d3436568ed72266c9a5aa057653f9162b
    role: model_weight_initialization_only_not_resume
  normalizer_source: frozen_original_training_split_only
  paired_training_seeds:
  - 3072
  early_stopping: false
  checkpoint_selection: final_fixed_step
  distributed_execution:
    strategy: ddp
    transport_configuration: framework_defaults_with_frozen_rendezvous_timeout
    rendezvous_timeout_seconds: 7200
    rendezvous_timeout_scope: passage_multi_gpu_only
    audit_scheduling:
      policy: sibling_exclusive_flock
      maximum_concurrency: 1
      scope: per_rank_full_audit_and_fit_start_storage_revalidation
      lock_protocol: contextworld.hidden_passage_h3.audit_scheduling_lock.v1
      lock_order: release_shared_then_audit_exclusive
      collective_holds_lock: false
      topology_scope: single_node_8gpu
      concurrent_training_runs_per_release: 1
    training_run_exclusivity:
      protocol: contextworld.hidden_passage_h3.training_run_lock.v1
      policy: one_root_training_run_per_release
      maximum_concurrency: 1
      blocking: false
      scope: full_root_training_or_preflight_call
      held_through_report_snapshot: true
      nonzero_rank_admission: direct_parent_holds_root_training_lock
    primary_formal_launch: fresh
    resume_role: disaster_recovery_only
    resume_scope: complete_epoch_boundary_only
  group_sampling:
    H3_PassageReplay50_SIGReg0p09:
      original: 0.5
      passage_mixed: 0.5
    H3_PassageReplay50_SIGReg0p20:
      original: 0.5
      passage_mixed: 0.5
    H3_PassageReplay50_SIGReg0p30:
      original: 0.5
      passage_mixed: 0.5
    H3_PassageReplay50_SIGReg0p90:
      original: 0.5
      passage_mixed: 0.5
  fairness_contract:
    equal_across_models:
    - initialization_checkpoint_bytes
    - original_train_normalizer_bytes
    - architecture_and_history_length
    - training_seed_and_data_order
    - original_to_synthetic_group_weights
    - logical_optimizer_draws
    - optimizer_scheduler_and_encoder_learning_rate
    - eight_gpu_execution_topology
    intentional_difference: lewm_sigreg_weight_only
    group_sampling:
      original: 0.5
      passage_mixed: 0.5
    per_group_draws_at_formal_budget:
      original: 524288
      passage_mixed: 524288
  profiles:
    passage_pilot:
      optimizer_steps: 256
      effective_global_batch: 1024
      total_logical_draws: 262144
    passage_formal:
      optimizer_steps: 1024
      effective_global_batch: 1024
      total_logical_draws: 1048576
  sigreg_falsification_gate:
    weights:
    - 0.09
    - 0.2
    - 0.3
    null_hypothesis: a modest SIGReg increase solves Door without a practically meaningful original-domain
      CEM decrease
    decision: if any increased weight passes Door and is CEM-noninferior to the replay-matched 0.09 control,
      stop the structural-defect and new-objective route
    cem_noninferiority_margin_absolute: 0.05
    comparison_unit: paired_frozen_query
    confidence: 0.95
  adaptive_sigreg_falsification_extension:
    weight: 0.9
    motivation_observed_before_freeze:
      sigreg_0p30_door_formal_passed: false
      sigreg_0p30_matching_history_target_accuracy: 0.6766666666666666
      sigreg_0p30_original_cem_success_rate: 0.93
      sigreg_0p30_original_cem_noninferior_to_0p09: true
    decision: if λ=0.90 passes Door and is paired-CEM-noninferior to the replay-matched λ=0.09 control,
      stop the new-objective route
    cem_noninferiority_margin_absolute: 0.05
    comparison_unit: paired_frozen_query
    confidence: 0.95
    adaptive_not_part_of_original_preregistration: true
