# ---------------------------------------------------------------------------
# The four adjudicated exceptions are NOT re-adjudicated here
# ---------------------------------------------------------------------------

adjudicated_exceptions:
  rule: >-
    This addendum inherits the four per-file adjudications written in the v3
    addendum verbatim and pins them to the digests recorded there.  It does not
    widen, reinterpret or add to them.  A fifth differing file, or any change to
    one of these four, invalidates the build.
  inherited_from: research/conditional_dynamics_representation/configs/action_delay_h7_a0_aux_pcja_predictor_only_private_development_v1_source_rebind_addendum_v3.yaml
  files:
    - path: contextworld/evaluation/action_delay_h7_score.py
      verdict: behaviour_preserving_for_this_line
      pinned_observed_sha256: 112fb51c72f132bdc5cb2d052cbebf19593a6f69df854e5be52689f608f807d5
    - path: contextworld/benchmarks/adapters.py
      verdict: behaviour_preserving_for_this_line
      pinned_observed_sha256: cc9e758b7081a57251e8cd026e9ac9ff8a17e3f300d52f464bdad871edcf26b2
    - path: contextworld/evaluation/__init__.py
      verdict: packaging_only
      pinned_observed_sha256: f7c8632df364aef88fba8a7b2eee8f2d2e7d6d68b3ef39ba51fee9043252814b
    - path: contextworld/synthesis/__init__.py
      verdict: packaging_only
      pinned_observed_sha256: 88213a0c1dd9c74734e61bdb6c7cedb416c9c960f18a39f94399cfff3af1dd84

  live_demonstration_that_this_gate_is_not_decorative:
    what_happened: >-
      While this work was in progress the content gate FIRED on
      contextworld/benchmarks/adapters.py and refused, then passed on a re-run
      minutes later.
    transiently_observed_sha256: 4cc2bbd786370d9aa847aa8dd1adf1e42450d535fa2b2d4c84f84681879c34a9
    cause: >-
      An unrelated, uncommitted working-tree edit adding a PreJEPA adapter
      family, subsequently reverted.  No commit touched the file.
    verified_by: >-
      AST comparison of the reverted state against HEAD - 21 top-level
      definitions on both sides, zero common definitions changed, zero added,
      zero removed, module-level code identical, and each of
      LatentWorldModelAdapter, StableWorldModelLeWMAdapter and
      StableWorldModelLeWMHistory7Adapter byte-identical.
    a_wrong_intermediate_finding_is_recorded_not_dropped: >-
      An earlier regex-based comparison in the same session reported
      StableWorldModelLeWMAdapter as changed.  That was an artifact of a pattern
      that relied on a trailing class boundary the edited file did not have.
      The AST comparison supersedes it.  The wrong intermediate result is
      recorded here rather than silently discarded.
    what_it_proves: >-
      A HEAD pin would have said nothing about this change, because no commit
      was made.  The content gate caught it and refused.  This is the argument
      for the ruling, observed rather than asserted.

# ---------------------------------------------------------------------------
# The replacement gate
# ---------------------------------------------------------------------------

build_source_gate:
  authority: the_45_file_content_closure
  require_every_sha256_exact_except_the_four_adjudicated: true
  adjudicated_exceptions_pinned_by_hash: true
  unlisted_difference_behaviour: invalidate
  require_head_equals_a_pinned_commit: false
  head_is_recorded_not_gated: true
  require_head_stable_during_build: true
  require_stablewm_worktree_clean: true
  rationale: >-
    A tree that changes mid-build was never one state.  Stability during the
    read is a genuine content property and is retained; equality to a
    predetermined commit is not, and is dropped.

decision_contract:
  if_all_unadjudicated_files_equal_and_head_stable: permit_release_build_under_the_v2_preregistration
  if_any_unadjudicated_file_differs: invalidate_without_build_claim_or_score
  if_an_adjudicated_file_changes_again: invalidate_and_require_a_new_adjudication
  if_head_moves_during_the_build: invalidate
  score_allowed_before_release_identity: false
  exclusive_claim_allowed_before_release_identity: false
  terminal_identity_allowed_before_release_identity: false
  prior_receipt_mutation_allowed: false
  v1_release_mutation_allowed: false

candidate_blinding:
  candidate_checkpoint_opened_by_this_addendum: false
  prediction_latent_or_score_computed: false
  public_test_or_sealed_content_opened: false
  seeds_4096_and_5120_blindness_claimed: true
  seed_3072_blindness_claimed: false
  note: >-
    The seed-3072 result is already published and was read while investigating
    the blockers.  No blindness is claimed for it.  It serves in this release
    only as a positive calibration.

# ---------------------------------------------------------------------------
# What this enables and what it does not
# ---------------------------------------------------------------------------

what_this_enables_and_what_it_does_not:
  enables: >-
    The v2 one-use release can be BUILT against a ContextWorld tree that
    actually exists, with the four adjudicated differences disclosed rather than
    concealed, once the separate contract-sections addendum supplies the
    training_contract, runtime_rebind and binding_chain items the frozen builder
    chain requires.
  does_not_enable:
    - scoring any candidate
    - opening any candidate checkpoint
    - adding candidates to the consumed v1 release
    - treating any seed as evaluated
  the_evaluation_remains_unperformed: true

outputs:
  root: research/conditional_dynamics_representation/artifacts/action_delay_h7_a0_aux_pcja_predictor_only_multiseed_private_development_v2_build_source_gate_addendum_v1
  overwrite: forbidden
