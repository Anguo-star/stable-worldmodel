# Append-only build-source-gate addendum v1 for the predictor-only multi-seed
# Development release v2.
#
# WHAT THIS CHANGES, IN ONE SENTENCE: inside the release BUILDER, the gate moves
# from "ContextWorld git HEAD must equal a pinned commit" to "every file in the
# 45-file scoring source closure must be byte-identical, and the four files that
# are not must sit at exactly the digests already adjudicated in the v3
# addendum".  The commit identity becomes a recorded fact.
#
# THIS IS THE SAME RULING THE v3 ADDENDUM ALREADY MADE FOR THE AUDITOR, APPLIED
# TO THE BUILDER.  It is a tightening, not a relaxation: the builder's own
# per-file hash loop keeps running, and now it always runs.
#
# WHAT IT DOES NOT DO: it does not authorize a score, does not open a checkpoint,
# does not re-consume the spent v1 release, does not add or remove a candidate,
# does not change any gate threshold, and does not license any other frozen
# contract to be loosened.

schema_version: 1
analysis_id: action_delay_h7_a0_aux_pcja_predictor_only_multiseed_private_development_v2_build_source_gate_addendum_v1
status: frozen_before_any_v2_release_build_claim_or_score
overwrite: forbidden
frozen_date_utc: 2026-08-20

audit_contract:
  path: research/conditional_dynamics_representation/AUDIT_CONTRACT.md
  version: 1
  clause_applied: >-
    section 1, content invariant over position proxy.  This addendum is the
    fifth instance of that pattern and the first found inside a frozen builder
    rather than an auditor.

authority:
  approver_message_verbatim: "按你推荐顺序快速完成吧，不要绕到审计无限循环了，处理好后把下一部新方法重新考虑讲清楚"
  approved_in_response_to: >-
    a report that (a) the v2 preregistration is missing three sections the
    frozen builder chain requires, and (b) verify_source_identity hard-gates git
    HEAD equality ahead of its own per-file hash loop, so the content check is
    unreachable once HEAD moves.  The report recommended fixing the HEAD gate
    first because it is a strict prerequisite for the build.
  ruling: replace_the_builder_head_position_gate_with_the_content_gate
  scope_of_this_addendum: the_build_time_source_identity_gate_only
  what_remains_closed:
    any_new_training: true
    evaluation_or_scoring_authorized: false
    checkpoint_may_be_opened: false
    one_use_consumption_rule_relaxed: false
    spent_v1_release_may_be_reconsumed: false
    candidate_set_may_change: false
    gate_thresholds_may_change: false
    cross_seed_pooling_averaging_or_rescue: false
    rejecting_the_pairing_method_family: false
    any_other_frozen_guard_loosened: false

# ---------------------------------------------------------------------------
# The defect
# ---------------------------------------------------------------------------

defect:
  gate_as_written: require(_git_head(contextworld_root) == str(config["contextworld_commit"]), "ContextWorld commit changed")
  location: >-
    the ContextWorld release build kernel, reached from
    build_action_delay_h7_a0_aux_pcja_predictor_only_private_development_v1.py
    via parent.parent.parent._v4().base.verify_source_identity
  content_check_it_precedes: >-
    the per-file sha256 loops in the same function over source_hashes,
    renderer_dependency_hashes, scoring_runtime_dependency_hashes and
    overlap_sources - that is, the whole 45-file closure.
  failure_mode_1_false_alarm: >-
    ContextWorld HEAD has advanced 16 commits past the commit recorded in the v1
    runtime_rebind.  None of them touched the scoring closure.
  failure_mode_2_the_serious_one: >-
    Because the commit comparison runs first, a HEAD mismatch prevents the
    per-file comparison from running at all.  The guard that carries the
    scientific meaning is unreachable exactly when someone most wants
    reassurance.  Conversely a rewritten scoring kernel sitting on the pinned
    commit would pass the gate that runs first.
  fifth_instance_of_the_pattern:
    - contextworld import closure - exact module-path set equality, broken by a lazy-import refactor that changed no behaviour
    - loss trace terminal step - last row must equal trainer.global_step, unsatisfiable by the frozen recipe's own intentional stop
    - source rebind head pin (auditor) - HEAD must equal a specific commit, broken by unrelated commits
    - audit output directory - directory must be empty, broken by a deliberately pre-written defect report
    - build source identity (this one) - HEAD must equal a specific commit, inside the frozen builder
  the_rule_that_does_not_change: >-
    A guard is satisfied by restoring the invariant, never by weakening the
    assertion.  This addendum does not weaken an assertion; it points the
    assertion at the quantity the contract was always about.

# ---------------------------------------------------------------------------
# Why the pinned commit cannot simply be checked out instead
# ---------------------------------------------------------------------------

why_not_just_restore_head:
  the_obvious_alternative: check out the pinned commit and run the builder unchanged
  why_it_does_not_work:
    - >-
      The commit pinned by the v2 source-rebind addendum,
      66761639a64dc5deddcab58bd47e25391f3ebec9, is NOT an ancestor of the
      current HEAD.  It sits on an abandoned line of history.  Checking it out
      discards 16 commits of unrelated work rather than reproducing a state.
    - >-
      One closure file, contextworld/evaluation/action_delay_h7_paired_data.py,
      was an untracked working-tree file when the rebind was audited.  No
      commit, including the pinned one, has ever equalled the audited state.
      This was already established and recorded in the v3 addendum.
  measured:
    contextworld_head_at_this_addendum: 6a82f670406417d745ce1897d60cb81afb1d6373
    commit_recorded_by_v1_runtime_rebind: 0fb72e1d0bfb2449340627d0fd5b8e00e7f82e4b
    commit_pinned_by_v2_source_rebind: 66761639a64dc5deddcab58bd47e25391f3ebec9
    commits_from_v1_recorded_to_head: 16
    v2_pinned_commit_is_ancestor_of_head: false
    v1_recorded_commit_is_ancestor_of_head: true

