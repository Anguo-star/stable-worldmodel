    the blocking cost estimate for a new release was never measured, and that
    the PLDM line had already replicated cleanly on these same two seed numbers.
  authorizes:
    draft_this_preregistration: true
    build_the_v2_release_checkpoint_blind: true
    score_the_three_declared_cells_once: true
    publish_per_seed_gate_decisions: true
  does_not_authorize:
    any_new_training: true
    reopening_or_re_consuming_the_v1_release: true
    editing_any_v1_file_receipt_or_result: true
    public_or_test_access: true
    cem_execution: true
    additional_seeds_beyond_4096_and_5120: true
    weight_k_budget_data_or_architecture_change: true
    cross_seed_pooling_averaging_or_rescue: true
    rejecting_the_pairing_method_family: true
  optimizer_updates_added_by_this_preregistration: 0

