claim_boundary: >-
  The release must be frozen and built without opening the seed-4096 or
  seed-5120 checkpoints.  Terminal hashing and receipt-structure audit are
  allowed before the claim.  Checkpoint deserialization, model load, prediction,
  latent extraction, and any score require the exclusive v2 claim.  Public and
  Test remain denied.

