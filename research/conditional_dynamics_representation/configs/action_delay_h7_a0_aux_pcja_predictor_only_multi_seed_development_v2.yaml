# Append-only preregistration: one-use Development release v2 for the
# predictor-only PCJA line, built to score the two ALREADY-TRAINED replication
# seeds 4096 and 5120.
#
# WHY THIS EXISTS.  The multi_seed_v1 preregistration said the evaluation would
# reuse the Development protocol "verbatim".  That was correct about the
# protocol and wrong about the artifact: the protocol is embodied in a one-use
# release that seed 3072 has already consumed.  Reusing it would mean either
# adding candidates after consumption or re-consuming a spent release, and the
# value of the published seed-3072 number comes precisely from that release
# having been consumed once, blind.  The defect is recorded in
# artifacts/..._multi_seed_v1/receipts/evaluation_blocked_v1.json.  This
# preregistration is the fix, and it follows the PLDM full-F stage2 v4
# precedent exactly: a NEW one-use release, FRESH eval seeds, a FRESH bootstrap
# seed, a positive-calibration candidate on the same new release, and per-seed
# gate decisions with pooling and rescue forbidden.
#
# COST, MEASURED RATHER THAN ASSERTED.  The evaluation_blocked receipt called a
# new release "a substantial build, not a script invocation".  That was my
# estimate, not a measurement, and it was wrong by roughly an order of
# magnitude: the predictor-only v1 release staged 306 files in 23.9 minutes and
# published them in about 1 minute; PLDM v4 published 306 files inside 2
# minutes.  Recorded here so the mistake does not propagate as a reason to
# avoid replication work.

schema_version: 1
analysis_id: action_delay_h7_a0_aux_pcja_predictor_only_multi_seed_development_v2
status: frozen_before_any_v2_release_build_claim_or_score
overwrite: forbidden
frozen_date_utc: 2026-08-19
release_id: action-delay-h7-a0-aux-pcja-predictor-only-multiseed-private-v2
benchmark: tworoom_action_delay_h7_a0_aux_pcja_predictor_only_multiseed_development_v2
output_root: research/conditional_dynamics_representation/artifacts/action_delay_h7_a0_aux_pcja_predictor_only_multiseed_private_development_v2

purpose: >-
  One-use, checkpoint-blind, Development-only evaluation of the two already
  trained predictor-only PCJA replication seeds (4096, 5120), scored alongside
  a positive-calibration candidate on the SAME new release so that a new-seed
  failure can be distinguished from a harder query set.

