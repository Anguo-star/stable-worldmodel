    seeds_4096_and_5120_scored_under: action-delay-h7-pldm-full-f-stage2-private-v4
    conclusion: >-
      The additional seeds were NOT scored by reusing the spent release.  A new
      one-use release was built with fresh eval seeds, a fresh bootstrap seed,
      and a positive-calibration candidate.  Both confirmation seeds then passed
      all four gates individually, with pooling and rescue explicitly forbidden.
  measured_build_cost:
    v1_staging_span_minutes: 23.9
    v1_publication_span_minutes: 1
    pldm_v4_publication_span_minutes: 2
    published_payload_file_count_v1: 305
    note: >-
