  parent_evaluator: research/conditional_dynamics_representation/scripts/eval_action_delay_h7_a0_aux_pcja_predictor_only_private_development_v1.py
  reuse_rule: >-
    The v2 builder and evaluator must be thin overlays over the frozen v1
    implementations, rebinding only the release identity, selector seeds, and
    candidate set.  Any behavioural change to selection, generation, scoring, or
    gating invalidates this preregistration.
