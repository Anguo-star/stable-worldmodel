  expected_models: 3
  exclusive_claim_required: true
  atomic_publication_and_receipt_last: true
  additions_after_consumption: forbidden
  tuning_from_release: forbidden
  candidate_additions_after_consumption: forbidden

# ---------------------------------------------------------------------------
# Decision contract, fixed before any number is seen
# ---------------------------------------------------------------------------

decision_contract:
  calibration_fail: invalid_release_or_adapter_no_candidate_conclusion
  candidate_results_recorded_per_seed: true
  replication_pass: both_confirmation_seeds_individually_pass_all_four_gates
  any_candidate_fail: no_cross_seed_replication_claim
  cross_seed_pooling_performed: false
  cross_seed_averaging_or_rescue_allowed: false
  score_ranking_or_post_result_candidate_selection_forbidden: true
  both_seeds_reported_regardless_of_outcome: true
  comparative_claim_authorized: false
  public_claim_authorized: false
  cem_claim_authorized: false

interpretation_limits:
  - >-
    A pass establishes that the seed-3072 Development result reproduces across
    two additional training seeds on a fresh query set.  It does NOT establish
    cross-task generality, CEM retention for the new seeds, or a method-level
    claim.
  - >-
    A failure of either seed falsifies the replication and must be reported.
    It does not by itself reject the pairing family, and it does not
    retroactively invalidate the seed-3072 result, which stands on its own
    one-use release.
  - >-
    This is ICL Development only.  The CEM retention question for seeds 4096
    and 5120 is untouched and unauthorized.
  - >-
    The seed-3072 ICL advantage over the full-gradient variant is NEGATIVE on
    all three accuracy gates (0.9309 vs 0.9451 macro); the predictor-only
    claim rests on CEM retention, not ICL accuracy.  Nothing in this release
    measures CEM, so no routing claim may be drawn from its outcome.
  - >-
    Data-split seed is held fixed at 3072 across all three training seeds; what
    varies is the training seed only.  This is a training-seed replication, not
    a data resample.

