case_id: stable-worldmodel:multitask-transfer-20260615
source_system: stable-worldmodel
source_task: "Evaluate transfer effects in three-task LeWM training"
stage: experiment

stages:
  - id: run:collect_existing_eval_metrics
    phase: result_analysis
    tool: research/multitask_transfer/scripts/summarize_eval_metrics.py
    status: completed
    path: research/multitask_transfer/scripts/summarize_eval_metrics.py
    outputs:
      - research/multitask_transfer/tables/eval_runs.csv
      - research/multitask_transfer/tables/eval_summary.csv
      - research/multitask_transfer/tables/exposure_equivalence.csv

claims:
  - id: claim:balanced_sampling_unequal_exposure
    text: "Balanced MT3 training maps to unequal per-task exposure: epoch 10 equals 10.00 PushT epochs, 10.89 Reacher epochs, and 27.12 TwoRoom epochs; epoch 30 equals 30.00 PushT epochs, 32.67 Reacher epochs, and 81.35 TwoRoom epochs."
    type: method_accounting
    state: evidence_attached
    scope: {fairness_view: per_task_exposure_matched}
  - id: claim:reacher_positive_transfer
    text: "Reacher receives positive transfer from MT3 training: MT3 epoch10 exceeds the exposure-matched single-task epoch10 control, and MT3 epoch30 remains above the Reacher single-task epoch33 control."
    type: empirical_score
    state: evidence_attached
    scope: {task: reacher, comparison: "MT3 epoch10/30 vs Reacher single epoch10/33"}
  - id: claim:pusht_neutral_transfer_exposure_matched
    text: "PushT shows no meaningful negative transfer under exposure matching."
    type: empirical_score
    state: evidence_attached
    scope: {task: pusht, comparison: "MT3 epoch10 vs PushT single epoch10"}
  - id: claim:pusht_compute_matched_single_task_stronger
    text: "PushT single-task epoch30 is stronger than MT3 epoch10 under compute matching."
    type: empirical_score
    state: evidence_attached
    scope: {task: pusht, comparison: "PushT single epoch30 vs MT3 epoch10"}
  - id: claim:pusht_single_task_stronger_long_exposure
    text: "PushT single-task epoch30 is stronger than MT3 epoch30 under long per-task exposure matching."
    type: empirical_score
    state: evidence_attached
    scope: {task: pusht, comparison: "PushT single epoch30 vs MT3 epoch30"}
  - id: claim:tworoom_no_negative_transfer
    text: "TwoRoom does not show negative transfer under available exposure-matched and long-exposure controls: MT3 epoch10 reaches 96.00% vs TwoRoom single-task epoch30 at 90.00%, and MT3 epoch30 reaches 98.67% vs TwoRoom single-task epoch80 at 85.33%."
    type: empirical_score
    state: evidence_attached
    scope: {task: tworoom, comparison: "MT3 epoch10/30 vs TwoRoom single epoch30/80"}
  - id: claim:task_selective_transfer
    text: "Three-task training shows task-selective transfer rather than uniform improvement: Reacher gains, PushT is neutral early but weaker than single-task at long exposure, and TwoRoom shows no negative transfer under the available exposure-matched and long-exposure controls."
    type: synthesis
    state: evidence_attached

