material_dissent:
  - id: dissent:fairness_view_confusion
    claim: claim:task_selective_transfer
    severity: material
    resolved: false
    summary: "Per-task exposure, compute-matched, and long-exposure comparisons support different PushT interpretations; reports must keep these views separate."
  - id: dissent:four_task_checkpoint_maturity
    claim: claim:four_task_pusht_no_clear_negative_transfer
    severity: material
    resolved: false
    summary: "MT4 epoch4 is severe undertraining evidence and should not be reported as the sustained PushT transfer effect; the current claim is anchored on epoch30."

native_system_behavior:
  can_restore_workspace_state: unknown
  can_replay_or_fork_agent_state: partial
  can_identify_downstream_claims: partial
  can_invalidate_claims: false
  can_downgrade_or_retract_released_claims: false
  can_preserve_old_history_append_only: partial
  can_require_reapproval: false
  can_export_machine_readable_revert_trace: false

expected_cairnlab_behavior:
  would_change_final_claim_state: true
  affected_objects_detected:
    - claim:pusht_single_task_stronger_long_exposure
    - claim:four_task_pusht_no_clear_negative_transfer
    - claim:four_task_cube_eval_available
    - claim:tworoom_no_negative_transfer
    - claim:task_selective_transfer
  proposed_transitions:
    - "Allow claim:tworoom_no_negative_transfer as evidence_attached for the available exposure-matched and long-exposure controls, while naming epoch30 and epoch80 as nearest available single-task checkpoints."
    - "Allow claim:pusht_single_task_stronger_long_exposure as evidence_attached for internal reporting."
    - "Allow claim:four_task_pusht_no_clear_negative_transfer as evidence_attached only when epoch4 is described as undertraining diagnostic evidence and epoch30 anchors the sustained-transfer conclusion."
    - "Allow claim:four_task_cube_eval_available as evidence_attached for eval availability only; block Cube transfer wording until a single-task Cube baseline is attached."
    - "Block any release wording that collapses exposure-matched, compute-matched, and long-exposure comparisons."

failure_classes:
  - metric_not_bound_to_claim
  - benchmark_score_hides_release_risk
  - fairness_view_requires_scoped_reporting
