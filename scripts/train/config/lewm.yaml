defaults:
  - _self_
  - launcher: local
  - data: pusht

output_model_name: lewm
subdir: ${hydra:job.id}

num_workers: 6
train_split: 0.9
seed: 3072
img_size: 224
patch_size: 14
encoder_scale: tiny
embed_dim: 192
encoder_resnet9: False
train_value_function: False
projector_loss_weight: 1e-3
dump_object: True

trainer:
  max_epochs: 100
  devices: auto
  accelerator: gpu
  strategy: auto
  precision: bf16
  gradient_clip_val: 1.0
  # COJA supplies a DDP-aware relation batch sampler and disables Lightning's
  # automatic sampler injection through the unified launcher.
  use_distributed_sampler: true

loader:
  batch_size: 128
  num_workers: ${num_workers}
  drop_last: True
  persistent_workers: True
  prefetch_factor: 3
  pin_memory: True
  shuffle: True

optimizer:
  type: AdamW
  lr: 5e-5
  weight_decay: 1e-3

logger_backend: none  # none | swanlab | wandb

swanlab:
  enabled: false
  collect_hardware: false
  hardware_monitor: false
  log_hyperparams: false
  config:
    project: stable-wm
    workspace: null
    experiment_name: ${output_model_name}
    id: ${subdir}
    logdir: /tmp/swanlab
    mode: null

wandb:
  enabled: false
  config:
    entity: stable-wm
    project: stable-wm
    name: ${output_model_name}
    id: ${subdir}
    resume: allow
    log_model: false

wm:
  history_size: 3
  num_preds: 1

model:
  _target_: stable_worldmodel.wm.lewm.LeWM
  # Fixed, parameter-free temporal coordinates. `absolute` is native LeWM;
  # `causal_transition` uses [z0, z1-z0, ...] inside every predict call and
  # therefore applies identically during training and autoregressive rollout.
  temporal_input_basis: absolute
  encoder:
    _target_: stable_pretraining.backbone.utils.vit_hf
    size: ${encoder_scale}
    patch_size: ${patch_size}
    image_size: ${img_size}
    pretrained: false
    use_mask_token: false
  predictor:
    _target_: stable_worldmodel.wm.lewm.module.Predictor
    num_frames: ${wm.history_size}
    input_dim: ${embed_dim}
    hidden_dim: ${embed_dim}
    output_dim: ${embed_dim}
    depth: 6
    heads: 16
    mlp_dim: 2048
    dim_head: 64
    dropout: 0.1
    emb_dropout: 0.0
  action_encoder:
    _target_: stable_worldmodel.wm.lewm.module.Embedder
    input_dim: ???
    emb_dim: ${embed_dim}
  projector:
    _target_: stable_worldmodel.wm.lewm.module.MLP
    input_dim: ${embed_dim}
    output_dim: ${embed_dim}
    hidden_dim: 2048
    norm_fn:
      _target_: torch.nn.BatchNorm1d
      _partial_: true
  pred_proj:
    _target_: stable_worldmodel.wm.lewm.module.MLP
    input_dim: ${embed_dim}
    output_dim: ${embed_dim}
    hidden_dim: 2048
    norm_fn:
      _target_: torch.nn.BatchNorm1d
      _partial_: true

loss:
  # Select exactly one representation regularizer. Keeping SIGReg as
  # the default preserves the native LeWM objective and old configs that omit
  # this field.
  regularizer: sigreg  # native LeWM
  sigreg:
    weight: 0.09
    kwargs:
      knots: 17
      num_proj: 1024
      # 1.0 is the exact native mean; values below one average only the
      # largest per-time projection statistics (Tail-SIGReg).
      tail_fraction: 1.0
      # 1.0 is the exact native symmetric statistic. Values below one retain
      # less pressure on overdispersed projections than on underdispersed
      # projections.
      overdispersion_weight: 1.0
  # Parameter-free Gaussian location mixture: apply the unchanged SIGReg
  # statistic to z[t,b] - mean_t(z[:,b]).  Trajectory locations remain free;
  # centering is differentiable and uses neither detach nor pair metadata.
  temporally_centered_sigreg:
    weight: 0.09
    kwargs:
      knots: 17
      num_proj: 1024
  # One matrix-normal SIGReg target. A deterministic Helmert basis separates
  # the temporal center and contrasts, their declared random-intercept
  # variances are whitened, then time and feature are jointly sketched. With
  # rho=null, rho=1/T^2 is resolved from the runtime sequence length.
  joint_temporal_covariance_sigreg:
    weight: 0.09
    kwargs:
      knots: 17
      num_proj: 1024
      rho: null
  # The same JTCov statistic and null, applied to the causal trajectory made
  # by prefixing the existing prediction sequence with the encoder frames
  # that have no prediction target. This reuses the prediction forward used
  # by MSE, keeps every edge differentiable, and consumes no pair metadata.
  predictive_joint_temporal_covariance_sigreg:
    weight: 0.09
    kwargs:
      knots: 17
      num_proj: 1024
      rho: null
  # Uses the same one-component SIGReg statistic on condition-matched Haar
  # high-pass contrasts. The data adapter must provide disjoint
  # `conditional_pairs` and a time-by-pair `conditional_active` mask derived
  # from model-visible conditioning variables. With no metadata it falls back
  # exactly to native SIGReg, which is also the validation-time behavior.
  conditional_sigreg:
    weight: 0.09
    kwargs:
      knots: 17
      num_proj: 1024
      randomize_pair_orientation: true
  # Training-only conditional-overlap relation. It reuses the existing LeWM
  # predictions and detached targets, adds no model parameters, and is off by
  # default. A pair-preserving data adapter supplies conditional_joint_group;
  # the metadata is removed before the model boundary.
  conditional_joint:
    enabled: false
    weight: 0.09
    group_width: 2
  # Optional VCReg controls for mechanism studies. Disabled defaults preserve
  # the native LeWM objective exactly.
  std:
    enabled: false
    weight: 18.0
  std_t:
    enabled: false
    weight: 0.7
  cov:
    enabled: false
    weight: 12.0
  cov_t:
    enabled: false
    weight: 0.0
